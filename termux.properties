allow-external-apps = true

# Shortcut Session
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 5
shortcut.previous-session = ctrl + 4

# Extra Keys - Format Satu Baris (Paling Stabil)
extra-keys = [['ESC','/','-','CTRL','UP','ALT','PGUP','KEYBOARD'],['HOME','END','TAB','LEFT','DOWN','RIGHT','PGDN','BKSP']]
